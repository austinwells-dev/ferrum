[package]
name = "ferrum"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A from-scratch LLM inference engine for Apple Silicon, in Rust with hand-written Metal kernels"
license = "MIT OR Apache-2.0"
repository = "https://github.com/austinwells-dev/ferrum"
readme = "README.md"
keywords = ["llm", "metal", "inference", "apple-silicon", "gguf"]
categories = ["science", "command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
minijinja = { version = "2", features = ["json", "loader", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLComputeCommandEncoder", "MTLBuffer", "MTLResource", "MTLComputePipeline", "MTLLibrary", "MTLTypes", "MTLAllocation", "MTLResidencySet", "objc2-core-foundation"] }
rand = "0.9"
rand_chacha = "0.9"
ratatui = "0.30.2"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
smallvec = "1.16.1"
thiserror = "2.0.20"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
unicode-width = "0.2"

[features]
# The general transformer engine (`model`, `ops`, `nn`, ...) behind `ferrum run`.
# The TUI, server and CLI run only the hybrid engine and do not need it.
legacy-engine = []

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "runtime"
harness = false
required-features = ["legacy-engine"]

# Integration tests and probes of the general engine.
[[test]]
name = "correctness"
required-features = ["legacy-engine"]

[[test]]
name = "fusion_parity"
required-features = ["legacy-engine"]

[[test]]
name = "granite"
required-features = ["legacy-engine"]

[[test]]
name = "granite_moe"
required-features = ["legacy-engine"]

[[test]]
name = "lfm2"
required-features = ["legacy-engine"]

[[test]]
name = "lfm2_moe"
required-features = ["legacy-engine"]

[[test]]
name = "lfm2_moe_gguf"
required-features = ["legacy-engine"]

[[test]]
name = "loading"
required-features = ["legacy-engine"]

[[test]]
name = "olmo2"
required-features = ["legacy-engine"]

[[test]]
name = "qwen"
required-features = ["legacy-engine"]

[[test]]
name = "qwen3"
required-features = ["legacy-engine"]

[[test]]
name = "qwen3_gguf"
required-features = ["legacy-engine"]

[[test]]
name = "real_model"
required-features = ["legacy-engine"]

[[test]]
name = "runtime_optimization"
required-features = ["legacy-engine"]

[[test]]
name = "transformer"
required-features = ["legacy-engine"]

[[example]]
name = "phase55_bench"
required-features = ["legacy-engine"]

[[example]]
name = "phase5_matrix"
required-features = ["legacy-engine"]

[[example]]
name = "projection_bench"
required-features = ["legacy-engine"]

[[example]]
name = "qwen_probe"
required-features = ["legacy-engine"]

[[example]]
name = "qwen_quant_quality"
required-features = ["legacy-engine"]

[[example]]
name = "reduction_bench"
required-features = ["legacy-engine"]

[[example]]
name = "rounding_probe"
required-features = ["legacy-engine"]

[[example]]
name = "runtime_matrix"
required-features = ["legacy-engine"]

[[example]]
name = "token_probe"
required-features = ["legacy-engine"]

# macOS 27's dyld rejects some stripped proc-macro dylibs (LINKEDIT alignment).
# Build-time tools are not shipped; keeping them unstripped avoids E0463 at release build.
[profile.release.build-override]
strip = false
